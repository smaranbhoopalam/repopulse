[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguard"
version = "1.0.0"
description = "AI-assisted Repository Health Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.scripts]
driftguard = "driftguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["driftguard"]